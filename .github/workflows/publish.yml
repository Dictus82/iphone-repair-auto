# 예약 게시: 15분마다 승인된 게시물 중 예약 시간이 지난 것을 게시합니다.
# 실제 게시는 저장소 변수 PUBLISH_ENABLED = true 일 때만 합니다. (그 전에는 미리보기만)
# 시간 계산은 프로그램 안에서 한국 시간(KST)으로 합니다. cron은 UTC 기준이며 정각 혼잡을 피해 7분 단위로 실행합니다.
name: 예약 게시

on:
  # 예약 실행 켜짐 (2026-11-03 사장님 요청). 끄려면 아래 두 줄 앞에 # 을 붙입니다.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "실제 게시 (체크 해제 시 미리보기)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow imageio-ffmpeg
      - name: git 사용자 설정
        run: |
          git config user.name "instagram-publisher"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: 게시
        working-directory: automation
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_LOGIN_TYPE: ${{ vars.IG_LOGIN_TYPE }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          LIVE: ${{ github.event_name == 'schedule' || inputs.live }}
        run: |
          if [ "$LIVE" = "true" ]; then
            python publish.py --live --commit
          else
            python publish.py
          fi
      - name: 현황표 갱신
        if: always()
        run: |
          python automation/status.py --write
          python automation/status.py >> "$GITHUB_STEP_SUMMARY"
          git add content/SCHEDULE.md
          git diff --cached --quiet || (git commit -m "게시 현황 갱신" && git pull --rebase && git push)
